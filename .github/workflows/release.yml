name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Validate tag and project version
        shell: bash
        run: |
          set -euo pipefail
          project_version="$(xcodebuild -project Cellar.xcodeproj -scheme Cellar -configuration Release -showBuildSettings | awk '/MARKETING_VERSION =/ { print $3; exit }')"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$project_version" != "$tag_version" ]]; then
            echo "tag $tag_version does not match MARKETING_VERSION $project_version" >&2
            exit 1
          fi

      - name: Import Developer ID certificate
        shell: bash
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          keychain_path="$RUNNER_TEMP/cellar-signing.keychain-db"
          keychain_password="$(uuidgen)"
          certificate_path="$RUNNER_TEMP/cellar-developer-id.p12"
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          rm -f "$certificate_path"

      - name: Prepare notarization API key
        shell: bash
        env:
          NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          notary_key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$NOTARY_KEY_BASE64" | base64 --decode > "$notary_key"
          chmod 600 "$notary_key"
          echo "CELLAR_NOTARY_KEY=$notary_key" >> "$GITHUB_ENV"

      - name: Build, sign, notarize, and verify
        shell: bash
        env:
          CELLAR_SIGNING_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_IDENTITY }}
          CELLAR_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          CELLAR_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          CELLAR_DIST_DIR: ${{ github.workspace }}/dist
        run: ./script/package_release.sh

      - name: Publish release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          title="Cellar $version"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "$title"
          fi

      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8"
          security delete-keychain "$RUNNER_TEMP/cellar-signing.keychain-db" 2>/dev/null || true
