name: Bug report
description: 报告一个可复现的 Cellar 问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: 感谢反馈。请移除用户名、完整路径、代理凭据和其他私密环境信息。
  - type: input
    id: version
    attributes:
      label: Cellar 版本
      placeholder: 2.2.2
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      placeholder: macOS 26.x, Apple Silicon, Homebrew 6.x
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请写出最小复现步骤。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为与已脱敏日志
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已移除凭据、用户名和不必要的完整本机路径
          required: true
