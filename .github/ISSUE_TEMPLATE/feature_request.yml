name: Feature request
description: 提议一项符合 Cellar 产品边界的改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 先描述问题，不要只描述按钮或实现。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: 影响范围与风险
      description: 是否涉及命令执行、PATH、Homebrew、代理或持久化状态？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
