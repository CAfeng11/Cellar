<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1280, initial-scale=1">
  <title>Cellar social preview</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 1280px;
      height: 640px;
      margin: 0;
      overflow: hidden;
      color: #f5f7fb;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
      background: #0d1016;
    }
    body {
      position: relative;
      display: flex;
      align-items: center;
      padding: 72px 70px;
      background:
        radial-gradient(circle at 8% 18%, rgba(255, 132, 38, .24), transparent 30%),
        radial-gradient(circle at 88% 22%, rgba(40, 138, 255, .26), transparent 34%),
        linear-gradient(132deg, #151821 0%, #0d1016 56%, #111620 100%);
    }
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: .16;
      background-image:
        linear-gradient(rgba(255,255,255,.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.07) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: linear-gradient(90deg, black, transparent 78%);
    }
    .copy {
      position: relative;
      z-index: 2;
      width: 440px;
      flex: 0 0 440px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-bottom: 34px;
    }
    .brand img {
      width: 78px;
      height: 78px;
      border-radius: 18px;
      box-shadow: 0 18px 44px rgba(0,0,0,.34);
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: #a9cfff;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: .11em;
      text-transform: uppercase;
    }
    .eyebrow::before {
      content: "";
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #2a8cff;
      box-shadow: 0 0 18px #2a8cff;
    }
    h1 {
      margin: 0 0 18px;
      font-size: 82px;
      line-height: .94;
      letter-spacing: -.055em;
    }
    .tagline {
      width: 410px;
      margin: 0;
      color: #d4d9e4;
      font-size: 28px;
      line-height: 1.24;
      letter-spacing: -.02em;
    }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 34px;
    }
    .chip {
      padding: 9px 14px;
      color: #dfe9f8;
      font-size: 15px;
      font-weight: 650;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 999px;
      background: rgba(255,255,255,.07);
      backdrop-filter: blur(18px);
    }
    .stage {
      position: absolute;
      z-index: 1;
      top: 91px;
      right: -42px;
      width: 760px;
      height: 480px;
      transform: rotate(-1.4deg);
    }
    .glow {
      position: absolute;
      inset: 28px 42px 0 10px;
      border-radius: 46px;
      background: linear-gradient(135deg, rgba(255,129,31,.45), rgba(35,131,255,.45));
      filter: blur(48px);
      opacity: .65;
    }
    .window {
      position: absolute;
      inset: 0;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 22px;
      background: #17191e;
      box-shadow: 0 38px 90px rgba(0,0,0,.58), 0 0 0 1px rgba(0,0,0,.3);
    }
    .window img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: left top;
    }
    .accent {
      position: absolute;
      z-index: 3;
      right: 42px;
      bottom: 34px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: rgba(255,255,255,.7);
      font-size: 15px;
      font-weight: 600;
    }
    .accent span {
      width: 34px;
      height: 4px;
      border-radius: 999px;
      background: linear-gradient(90deg, #ff8126, #2a8cff);
    }
  </style>
</head>
<body>
  <section class="copy">
    <div class="brand">
      <img src="../Cellar/Assets.xcassets/AppIcon.appiconset/128.png" alt="Cellar icon">
      <div class="eyebrow">Native macOS app</div>
    </div>
    <h1>Cellar</h1>
    <p class="tagline">Homebrew maintenance and runtime diagnostics, without the guesswork.</p>
    <div class="chips">
      <span class="chip">SwiftUI</span>
      <span class="chip">Homebrew</span>
      <span class="chip">Runtime Doctor</span>
    </div>
  </section>

  <section class="stage" aria-label="Cellar Runtime Doctor screenshot">
    <div class="glow"></div>
    <div class="window">
      <img src="images/cellar-runtime-doctor.jpeg" alt="Cellar Runtime Doctor">
    </div>
  </section>

  <div class="accent"><span></span>Explainable local maintenance</div>
</body>
</html>
